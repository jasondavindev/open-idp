argo:
  redis-ha:
    enabled: false

  controller:
    replicas: 1

  server:
    autoscaling:
      enabled: false

  repoServer:
    autoscaling:
      enabled: false

  applicationSet:
    replicas: 0

  notifications:
    enabled: false

  configs:
    params:
      server.insecure: true
      server.basehref: "/argo"
      server.rootpath: "/argo"

  cm:
    kustomize.buildOptions: "--enable-helm"

app-of-apps:
  repository: https://github.com/jasondavindev/open-idp.git
  pathPrefix: 01-applications
  targetRevision: main

  applications:
    traefik: {}
    elasticsearch: {}
    grafana: {}
    otel: {}
