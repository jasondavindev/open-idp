name: build
on:
  workflow_call:
    secrets:
      CONTAINER_REGISTRY:
        required: true
      REGISTRY_USER:
        required: true
      REGISTRY_PASSWORD:
        required: true
    outputs:
      full_image_name:
        value: ${{ jobs.prepare.outputs.full_image_name }}
        description: The full image name - registry + tag
      image_tag:
        value: ${{ jobs.prepare.outputs.image_tag }}
        description: The image tag to release a new deploy

jobs:
  build:
    needs: build
    runs-on: ubuntu-latest
    env:
      CONTAINER_REGISTRY: ${{ secrets.CONTAINER_REGISTRY }}
    steps:
      - name: prepare
        id: prepare
        shell: bash
        run: |
          APP_NAME="$(echo "${GITHUB_REPOSITORY}" | cut -d / -f 2)"
          IMAGE_NAME="${CONTAINER_REGISTRY}/${APP_NAME}"
          IMAGE_TAG="${GITHUB_SHA}"
          FULL_IMAGE_NAME=${IMAGE_NAME}:${IMAGE_TAG}

          {
            echo "APP_NAME=${APP_NAME}"
            echo "IMAGE_NAME=${IMAGE_NAME}"
            echo "IMAGE_TAG=${IMAGE_TAG}"
            echo "FULL_IMAGE_NAME=${FULL_IMAGE_NAME}"
          } >>"${GITHUB_ENV}"

          {
            echo "full_image_name=${FULL_IMAGE_NAME}"
            echo "image_tag=${IMAGE_TAG}"
          } >>"${GITHUB_OUTPUT}"


      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
          ref: ${{ github.ref_name }}

      - name: login
        shell: bash
        run: |
          echo "${{ secrets.REGISTRY_PASSWORD }}" | docker login "${CONTAINER_REGISTRY%%/*}" -u "${{ secrets.REGISTRY_USER }}" --password-stdin

      - name: build
        shell: bash
        run: |
          builder="${APP_NAME}-ci"

          # create docker builder for cache
          if ! docker buildx inspect "${builder}" >/dev/null 2>&1; then
              docker buildx create --name "${builder}" --driver docker-container --bootstrap >/dev/null
          fi

          docker buildx build \
              --builder "${builder}" \
              --cache-from "type=registry,ref=${IMAGE_NAME}:cache" \
              --cache-to "type=registry,ref=${IMAGE_NAME}:cache,mode=max,ignore-error=true" \
              --tag "${FULL_IMAGE_NAME}" \
              --push \
              .
